[workspace]
resolver = "2"
members = [
    "crates/rusted-types",
    "crates/rusted-inference",
    "crates/rusted-policy",
    "crates/rusted-agent",
    "crates/rusted-tools",
    "crates/rusted-vm",
    "crates/rusted-workspace",
    "crates/rusted-storage",
    "crates/rusted-api",
    "crates/rusted-ui",
    "crates/rusted-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["RUSTED AI Contributors"]
publish = false

[workspace.dependencies]
anyhow = "1.0.95"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread", "signal"] }
toml = "0.8.19"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json"] }

rusted-types = { path = "crates/rusted-types" }
rusted-inference = { path = "crates/rusted-inference" }
rusted-policy = { path = "crates/rusted-policy" }
rusted-agent = { path = "crates/rusted-agent" }
rusted-tools = { path = "crates/rusted-tools" }
rusted-vm = { path = "crates/rusted-vm" }
rusted-workspace = { path = "crates/rusted-workspace" }
rusted-storage = { path = "crates/rusted-storage" }
rusted-api = { path = "crates/rusted-api" }
rusted-ui = { path = "crates/rusted-ui" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
